@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 0 10px rgba(74,222,128,0)}}
@keyframes blink{50%{opacity:0}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:#fde68a}100%{transform:scale(1)}}

@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
:root:root:root{color-scheme:dark;--bg:#0a1230;--card:#111c3f;--tx:#f1ecd9;--mut:#a9b0c9;--ac:#e5b94a;--acx:#1a1405;--bd:#27345f;--warn:#fbbf24;--pk:#f472b6}
body{background:radial-gradient(900px 500px at 12% -5%,#18296a,transparent 60%),radial-gradient(700px 400px at 100% 30%,#2a2209,transparent 60%),var(--bg);background-attachment:fixed}

@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:#f6e3a1}100%{transform:scale(1)}}

</style></head><body>
<header class="top"><i class="bub b1"></i><i class="bub b2"></i><i class="bub b3"></i><i class="bub b4"></i><i class="bub b5"></i><div class="in"><div class="toprow"><div class="brandrow"><span class="logo">👥</span><span class="brand">Niche Split</span></div><div class="live"><span class="ld"></span>LIVE <span id="clk"></span></div></div><div class="tag"><span id="tw"></span><span class="caret"></span></div><div class="stats"><div class="st"><b id="sP">0</b><span>Present</span></div><div class="st"><b id="sG">0</b><span>Girls</span></div><div class="st"><b id="sA">0</b><span>Absent</span></div><div class="st"><b id="sT">0</b><span>Teams</span></div></div></div><svg class="wave" viewBox="0 0 2400 40" preserveAspectRatio="none"><path d="M0 20 Q150 0 300 20 T600 20 T900 20 T1200 20 T1500 20 T1800 20 T2100 20 T2400 20 V40 H0Z" fill="currentColor"/></svg></header>
<main>
<h2 class="sec">1. Class roster</h2>
<div class="cols" id="cols"></div>
<div class="legend"><b>Pink</b> = girl (each team gets one). Crossed out = absent.</div>

<h2 class="sec">2. Absent numbers</h2>
<div class="card"><div id="abs"></div></div>

<h2 class="sec">3. Split</h2>
<div class="card">
<div id="sug" class="sug"></div>
<div class="ctrl">
<div><label for="n">How many teams</label><input id="n" type="number" min="1" value="4"></div>
<button id="go">Split</button>
<button class="alt" id="again" style="display:none">Split again</button>
<button class="alt" id="copy" style="display:none">Copy</button>
</div>
<div id="warn" class="warn"></div>
</div>

<h2 class="sec" id="rh" style="display:none">Teams</h2>
<div class="res" id="out"></div>
</main>
<script>
var R={
'MBA General':['MS501','MS502','MS503','MS504','MS505','MS506','MS507','MS508','MS509','MS510','MS511','MS512','MS513','MS514','MS515','MS516','MS517','MS518','MS519','MS520','MS521','MS522','MS523','MS524','MS525','MS526','MS527','MS528','MS529','MS531','MS532','MS533','MS534','MS535','MS536','MS537','MS539','MS540','MS541','MS542'],
'MBA Aviation':['AV501','AV502','AV504','AV505','AV506','AV507'],
'MBA Logistics':['LS501','LS502','LS503','LS504','LS505']};
var C={'MBA General':'#60a5fa','MBA Aviation':'#2dd4bf','MBA Logistics':'#fb923c'};
var D=Object.keys(R),G={},X={},last=[];
var $=function(i){return document.getElementById(i)};
try{G=JSON.parse(localStorage.getItem('ts_girls')||'{}')}catch(e){G={}}
try{X=JSON.parse(localStorage.getItem('ts_extra')||'{}')}catch(e){X={}}
D.forEach(function(d){(X[d]||[]).forEach(function(p){p=Array.isArray(p)?p[0]:p;if(R[d].indexOf(p)<0)R[d].push(p)})});
var GIRLS={'MBA General':[6,7,9,10,15,17,30,32,37],'MBA Aviation':[2],'MBA Logistics':[4]};
function gSet(i){var s={};(GIRLS[D[i]]||[]).forEach(function(x){s[x]=1});return s}
function ser(d,r){return R[d].indexOf(r)+1}
function esc(s){return String(s).replace(/[&<>"]/g,'')}
function num(r){return parseInt(r.replace(/\D/g,''),10)}
function lab(r){var n=num(r)%100;return (n<10?'0':'')+n}
function absSet(i){var el=$('ab'+i),s={};if(!el)return s;(el.value.match(/\d+/g)||[]).forEach(function(x){s[parseInt(x,10)]=1});return s}
function build(){
  $('cols').innerHTML=D.map(function(d,i){return '<div class="card col" style="--c:'+C[d]+'"><h3><span class="dot"></span>'+d+'</h3><div class="cnt" id="c'+i+'"></div><div class="grid" id="l'+i+'"></div><div class="addr"><input id="ar'+i+'" inputmode="numeric" placeholder="Add roll no"><button class="alt" data-add="'+i+'">Add</button></div></div>'}).join('');
  $('abs').innerHTML=D.map(function(d,i){return '<div class="arow" style="--c:'+C[d]+'"><span><i class="dot"></i>'+d+'</span><input id="ab'+i+'" inputmode="numeric" placeholder="e.g. 45,55"></div>'}).join('');
  D.forEach(function(d,i){
    $('ab'+i).oninput=function(){var el=$('ab'+i),v=el.value.replace(/[^\d,]/g,',').replace(/,{2,}/g,',').replace(/^,/,'');if(v!==el.value)el.value=v;paint()};
    $('ar'+i).onkeydown=function(e){if(e.key==='Enter')addP(i)};});
  paint();
}
function paint(){
  var TP=0,TG=0;
  D.forEach(function(d,i){
    var a=absSet(i),gs=gSet(i),pres=0,g=0;
    $('l'+i).innerHTML=R[d].length?R[d].map(function(r){
      var ab=a[ser(d,r)],isg=gs[ser(d,r)];
      if(!ab){pres++;if(isg)g++}
      return '<div class="num'+(isg?' g':'')+(ab?' a':'')+'" style="--c:'+C[d]+'" data-r="'+esc(r)+'">'+esc(ser(d,r))+'</div>'}).join(''):'<div class="cnt">No students yet. Add roll numbers below.</div>';
    $('c'+i).textContent=pres+' present, '+g+' girls';TP+=pres;TG+=g;
  });
  suggest(TP,TG);
  stats(TP,TG);
}
function suggest(tp,tg){
  var el=$('sug');if(!tp){el.innerHTML='';return}
  var o={},warn=false;[3,4,5,6].forEach(function(sz){o[Math.max(1,Math.round(tp/sz))]=1});
  var ks=Object.keys(o).map(Number).sort(function(a,b){return b-a});
  var chips=ks.map(function(t){var lo=Math.floor(tp/t),hi=Math.ceil(tp/t),w=tg<t;if(w)warn=true;return '<span class="chip" data-t="'+t+'">'+t+' teams ('+(lo==hi?lo:lo+'-'+hi)+' each)'+(w?' \u26a0':'')+'</span>'}).join('');
  el.innerHTML='<div class="cnt" style="margin:0">'+tp+' present, '+tg+' girls marked. Suggested team counts (tap to use):</div>'+chips+(warn?'<div class="cnt" style="margin-top:8px">\u26a0 More teams than girls marked, so some teams won\'t have a girl.</div>':'');
}
function addP(i){
  var d=D[i],r=$('ar'+i).value.trim().toUpperCase();
  if(!r||!/\d/.test(r))return;
  if(R[d].some(function(p){return num(p)===num(r)}))return;
  R[d].push(r);(X[d]=X[d]||[]).push(r);
  try{localStorage.setItem('ts_extra',JSON.stringify(X))}catch(e){}
  $('ar'+i).value='';paint();
}
$('cols').onclick=function(e){
  var b=e.target.closest('[data-add]');if(b){addP(parseInt(b.dataset.add,10));return}
  var t=e.target.closest('.num');if(!t)return;
  
};
$('sug').onclick=function(e){var c=e.target.closest('[data-t]');if(c){$('n').value=c.dataset.t;stats()}};
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function split(){
  var girls=[],rest=[],w=[];
  D.forEach(function(d,i){var a=absSet(i);
    R[d].forEach(function(r){if(a[ser(d,r)])return;var x={r:r,d:d,g:!!gSet(i)[ser(d,r)]};(x.g?girls:rest).push(x)})});
  var total=girls.length+rest.length,n=Math.max(1,Math.min(parseInt($('n').value)||1,total||1));
  var o=$('out');o.innerHTML='';
  if(!total){$('warn').textContent='No one is present.';return}
  last=[];for(var k=0;k<n;k++)last.push([]);
  shuf(girls);var extra=[];
  girls.forEach(function(g,i){if(i<n)last[i].push(g);else extra.push(g)});
  if(girls.length<n)w.push('Only '+girls.length+' girl(s) marked for '+n+' teams, so '+(n-girls.length)+' team(s) have none.');
  if(extra.length)w.push(extra.length+' extra girl(s) added on top of one per team.');
  var all=shuf(extra.concat(rest)),ptr=0;shuf(last);
  all.sort(function(a,b){return D.indexOf(a.d)-D.indexOf(b.d)});
  all.forEach(function(p){
    var m=Math.min.apply(null,last.map(function(t){return t.length})),idx=0;
    for(var s=0;s<n;s++){var c=(ptr+s)%n;if(last[c].length===m){idx=c;break}}
    last[idx].push(p);ptr=(idx+1)%n});
  $('warn').textContent=w.join(' ');
  last.forEach(function(tm,i){
    var h='';
    D.forEach(function(d){
      var m=tm.filter(function(x){return x.d===d}).sort(function(a,b){return num(a.r)-num(b.r)});
      if(!m.length)return;
      h+='<div class="dr" style="--c:'+C[d]+'"><div class="dl"><i class="dot"></i>'+d+'</div><div class="grid">'+m.map(function(x){return '<div class="num r'+(x.g?' g':'')+'" style="--c:'+C[d]+'">'+esc(ser(x.d,x.r))+'</div>'}).join('')+'</div></div>'});
    var c=document.createElement('div');c.className='card team';c.style.animationDelay=(i*0.09)+'s';
    c.innerHTML='<div class="hd"><h3>Team '+(i+1)+'</h3><span class="badge">'+tm.length+' students</span></div>'+h;
    o.appendChild(c)});
  $('rh').style.display='';$('again').style.display='';$('copy').style.display='';
  confetti();try{$('rh').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
}
$('go').onclick=split;$('again').onclick=split;
